<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first: prevent native pinch-zoom, fill viewport including notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Not Roller Coaster Tycoon</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Prevent rubber-band scroll on iOS */
      overscroll-behavior: none;
      /* Block all native touch gestures — JS handles everything */
      touch-action: none;
      background: #1a1a2e;
    }

    #app {
      position: fixed;
      /* Respect notch / home-indicator safe areas */
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      overflow: hidden;
    }

    #world {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* UI canvas floats on top; pointer-events:none so clicks fall through to world canvas */
    #ui {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      touch-action: none;
    }

    /* ── HUD ── */
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px 10px;
      min-height: 48px;
      padding: max(env(safe-area-inset-top, 0px), 10px) 16px 8px;
      background: rgba(8, 8, 18, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #d8cfa0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .hud-sep { opacity: 0.35; }
    .hud-item { white-space: nowrap; }

    /* ── Tool Panel ── */
    .tool-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 8px;
      padding: 8px 16px max(env(safe-area-inset-bottom, 0px), 8px);
      background: rgba(8, 8, 18, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      touch-action: auto;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 56px;
      min-height: 56px;
      max-width: 100px;
      padding: 8px 6px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.07);
      color: #a09880;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }
    .tool-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }
    .tool-btn.active {
      background: rgba(90, 200, 80, 0.18);
      color: #7ee860;
      border-color: rgba(90, 200, 80, 0.45);
    }
    .tool-icon  { font-size: 22px; line-height: 1.2; }
    .tool-label { font-size: 10px; margin-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="world"></canvas>
    <canvas id="ui"></canvas>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
