<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first: prevent native pinch-zoom, fill viewport including notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Not Roller Coaster Tycoon</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Prevent rubber-band scroll on iOS */
      overscroll-behavior: none;
      /* Block all native touch gestures — JS handles everything */
      touch-action: none;
      background: #1a1a2e;
    }

    #app {
      position: fixed;
      /* Respect notch / home-indicator safe areas */
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      overflow: hidden;
    }

    #world {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* UI canvas floats on top; pointer-events:none so clicks fall through to world canvas */
    #ui {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      touch-action: none;
    }

    /* ── HUD ── */
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px 10px;
      min-height: 48px;
      padding: max(env(safe-area-inset-top, 0px), 10px) 16px 8px;
      background: rgba(8, 8, 18, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #d8cfa0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .hud-sep { opacity: 0.35; }
    .hud-item { white-space: nowrap; }

    .hud-speeds {
      display: inline-flex;
      gap: 3px;
      pointer-events: auto;
    }
    .speed-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid transparent;
      border-radius: 6px;
      color: #a09880;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      min-width: 28px;
      min-height: 26px;
      padding: 3px 6px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s, color 0.1s;
      font-family: inherit;
    }
    .speed-btn:active { background: rgba(255,255,255,0.15); }
    .speed-btn.active {
      background: rgba(90,200,80,0.2);
      border-color: rgba(90,200,80,0.5);
      color: #7ee860;
    }

    /* ── Tool Panel ── */
    .tool-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      padding: 8px 12px max(env(safe-area-inset-bottom, 0px), 8px);
      background: rgba(8, 8, 18, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      touch-action: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tool-panel::-webkit-scrollbar { display: none; }

    .tool-sep {
      flex: 0 0 1px;
      align-self: stretch;
      background: rgba(255,255,255,0.15);
      margin: 4px 2px;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-width: 58px;
      min-height: 56px;
      padding: 8px 6px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.07);
      color: #a09880;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }
    .tool-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }
    .tool-btn.active {
      background: rgba(90, 200, 80, 0.18);
      color: #7ee860;
      border-color: rgba(90, 200, 80, 0.45);
    }
    .tool-icon  { font-size: 22px; line-height: 1.2; }
    .tool-label { font-size: 10px; margin-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; }

    /* ── Track Editor Panel ── */
    .track-panel {
      position: absolute;
      bottom: calc(80px + 12px);
      right: 12px;
      z-index: 25;
      background: rgba(8, 8, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 10px 14px;
      color: #d8cfa0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 280px;
      max-width: calc(100vw - 24px);
    }
    .track-panel-title {
      font-size: 12px;
      text-align: center;
      color: #90a8d8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .track-pieces {
      display: flex;
      gap: 4px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .piece-btn {
      min-width: 50px;
      min-height: 44px;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.07);
      color: #a09880;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .piece-btn.active {
      background: rgba(90, 200, 80, 0.18);
      color: #7ee860;
      border-color: rgba(90, 200, 80, 0.45);
    }
    .piece-btn:disabled { opacity: 0.35; }
    .track-actions {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .track-btn {
      flex: 1;
      min-height: 36px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.07);
      color: #d8cfa0;
      font-size: 12px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .track-btn.primary {
      background: rgba(90, 200, 80, 0.18);
      color: #7ee860;
      border-color: rgba(90, 200, 80, 0.45);
    }
    .track-btn.danger {
      background: rgba(200, 60, 60, 0.15);
      color: #e87070;
      border-color: rgba(200, 60, 60, 0.35);
    }
    .track-btn:disabled { opacity: 0.35; }
    .track-errors {
      font-size: 11px;
      color: #e08060;
      text-align: center;
    }

    /* ── Ride Panel ── */
    .ride-panel {
      position: absolute;
      bottom: calc(80px + 12px);
      left: 12px;
      width: 210px;
      z-index: 25;
      background: rgba(8, 8, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 12px;
      color: #d8cfa0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .rp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .rp-name  { font-size: 15px; font-weight: 600; color: #e8dfa8; }
    .rp-close {
      background: none; border: none; color: #888;
      font-size: 22px; line-height: 1; cursor: pointer; padding: 0 2px;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .rp-status {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; font-size: 12px;
    }
    .rp-price { color: #90d890; }
    .rp-stats { margin-bottom: 10px; }
    .rp-row   { margin-bottom: 5px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #b0a880; }
    .bar      { display: inline-block; width: 56px; height: 7px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
    .bf       { display: block; height: 100%; border-radius: 4px; }
    .rp-footer { display: flex; justify-content: center; }
    .rp-toggle {
      border-radius: 7px; font-size: 12px; padding: 7px 18px;
      cursor: pointer; min-height: 36px; border-width: 1px; border-style: solid;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="world"></canvas>
    <canvas id="ui"></canvas>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
